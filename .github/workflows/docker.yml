name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMMAGINE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Metadati immagine
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMMAGINE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      # L'immagine viene caricata in locale e provata prima di finire nel registry.
      - name: Build per il test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: prova:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prova che il container risponda
        run: |
          docker run -d --name prova -p 3000:3000 prova:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/api/stato > /dev/null; then pronto=1; break; fi
            sleep 1
          done
          if [ -z "$pronto" ]; then docker logs prova; exit 1; fi
          curl -sf http://localhost:3000/ | grep -q "Etichette di spedizione"
          curl -sf http://localhost:3000/api/stato | grep -q '"prossimoCodice"'
          docker rm -f prova

      - name: Login su GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push multi-architettura
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
